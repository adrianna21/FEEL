<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to FEEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --feel-f: #F6A952;
      --feel-e1: #76D586;
      --feel-e2: #E8585F;
      --feel-l: #1DCBD6;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    body {
      background-image: url('assets/gradient_bg2.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(32px, 5vh, 80px) clamp(20px, 4vw, 60px);
      font-family: 'Nunito', sans-serif;
    }

    /* ── Tap hint ── */
    .tap-hint {
      font-family: 'Roboto', sans-serif;
      font-size: clamp(13px, 1.4vw, 18px);
      color: rgba(0,0,0,0.35);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      animation: fadeInDown 1s ease 2.4s both;
    }

    /* ── Greeting ── */
    .greeting {
      text-align: center;
      animation: fadeInDown 0.7s cubic-bezier(0.34,1.2,0.64,1) 0.1s both;
    }
    .greeting h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(32px, 6vw, 80px);
      color: #111;
      line-height: 1.1;
    }

    /* ── Mascot area ── */
    .mascot-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      max-width: 600px;
    }

    .mascot-img {
      width: clamp(320px, 65vw, 780px);
      height: auto;
      object-fit: contain;
      animation: mascotEntrance 0.9s cubic-bezier(0.34,1.3,0.64,1) 0.3s both;
      filter: drop-shadow(0 24px 48px rgba(41,193,231,0.22));
    }

    /* Floating sparkles around mascot */
    .sparkle {
      position: absolute;
      animation: float 3s ease-in-out infinite, fadeInScale 0.6s ease both;
      pointer-events: none;
    }
    .sparkle svg { display: block; }

    .sp1  { top: 12%; left: 2%;   animation-delay: 0.4s, 0s;  }
    .sp2  { top: 28%; left: 0%;   animation-delay: 0.6s, 0.1s; }
    .sp3  { top: 55%; left: 1%;   animation-delay: 0.8s, 0.2s; }
    .sp4  { top: 72%; left: 8%;   animation-delay: 1.0s, 0.15s;}
    .sp5  { top: 8%;  right: 6%;  animation-delay: 0.5s, 0.05s;}
    .sp6  { top: 38%; right: 0%;  animation-delay: 0.9s, 0.25s;}
    .sp7  { top: 62%; right: 4%;  animation-delay: 0.7s, 0.1s; }
    .sp8  { top: 80%; right: 12%; animation-delay: 1.1s, 0.3s; }
    .sp9  { top: 85%; left: 28%;  animation-delay: 1.2s, 0.35s;}

    @keyframes float {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      50%      { transform: translateY(-10px) rotate(8deg); }
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.3); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Bottom text block ── */
    .bottom-text {
      text-align: center;
      animation: fadeInUp 0.8s cubic-bezier(0.34,1.1,0.64,1) 0.6s both;
    }

    .welcome-label {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: clamp(18px, 3vw, 38px);
      color: #222;
      margin-bottom: 6px;
    }

    .feel-word {
      display: block;
      text-align: center;
      margin: 0 auto clamp(10px, 2vh, 20px);
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(52px, 11vw, 130px);
      line-height: 1;
      letter-spacing: -0.01em;
      background: linear-gradient(90deg, #F6A952 0%, #EAA4A6 36.82%, #BBA1D4 61.9%, #1DCBD6 86.98%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: letterPop 0.6s cubic-bezier(0.34,1.6,0.64,1) 0.7s both;
    }

    .tagline {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: clamp(12px, 1.5vw, 20px);
      color: rgba(0,0,0,0.45);
      line-height: 1.6;
    }

    /* ── Keyframes ── */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes mascotEntrance {
      from { opacity: 0; transform: scale(0.7) translateY(30px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes letterPop {
      from { opacity: 0; transform: scale(0.4) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Ripple on tap */
    .ripple {
      position: fixed;
      border-radius: 50%;
      width: 10px; height: 10px;
      background: rgba(41,193,231,0.3);
      transform: scale(0);
      pointer-events: none;
      animation: rippleOut 0.5s ease-out forwards;
    }
    @keyframes rippleOut {
      to { transform: scale(40); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Greeting at top -->
  <div class="greeting">
    <h1>Hi, {name} 👋</h1>
  </div>

  <!-- Mascot centre -->
  <div class="mascot-area">

    <!-- Sparkles -->
    <div class="sparkle sp1">
      <svg width="32" height="32" viewBox="0 0 24 24"><path d="M12 2L13.5 10.5L22 12L13.5 13.5L12 22L10.5 13.5L2 12L10.5 10.5Z" fill="none" stroke="#29C1E7" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
    <div class="sparkle sp2">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2L13.5 10.5L22 12L13.5 13.5L12 22L10.5 13.5L2 12L10.5 10.5Z" fill="#8956E2"/></svg>
    </div>
    <div class="sparkle sp3">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2L13.5 10.5L22 12L13.5 13.5L12 22L10.5 13.5L2 12L10.5 10.5Z" fill="#76D586"/></svg>
    </div>
    <div class="sparkle sp4">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2L13.5 10.5L22 12L13.5 13.5L12 22L10.5 13.5L2 12L10.5 10.5Z" fill="#E8585F"/></svg>
    </div>
    <div class="sparkle sp5">
      <svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2L13.5 10.5L22 12L13.5 13.5L12 22L10.5 13.5L2 12L10.5 10.5Z" fill="#F6A952"/></svg>
    </div>
    <div class="sparkle sp6">
      <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 2L13.5 10.5L22 12L13.5 13.5L12 22L10.5 13.5L2 12L10.5 10.5Z" fill="none" stroke="#E8585F" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
    <div class="sparkle sp7">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2L13.5 10.5L22 12L13.5 13.5L12 22L10.5 13.5L2 12L10.5 10.5Z" fill="#29C1E7"/></svg>
    </div>
    <div class="sparkle sp8">
      <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2L13.5 10.5L22 12L13.5 13.5L12 22L10.5 13.5L2 12L10.5 10.5Z" fill="#F6A952"/></svg>
    </div>
    <div class="sparkle sp9">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2L13.5 10.5L22 12L13.5 13.5L12 22L10.5 13.5L2 12L10.5 10.5Z" fill="#8956E2"/></svg>
    </div>

    <img class="mascot-img" src="assets/flowerwelcome.png" alt="FEEL mascot waving" />
  </div>

  <!-- Bottom text -->
  <div class="bottom-text">
    <p class="welcome-label">Welcome to</p>
    <div class="feel-word">FEEL</div>
    <p class="tagline">Your personal space to check in,<br>reflect, and understand how you feel.</p>
  </div>

  <!-- Tap hint -->
  <p class="tap-hint">Tap anywhere to continue</p>

<script>
  // Ripple effect on tap, then navigate
  document.body.addEventListener('click', function(e) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = (e.clientX - 5) + 'px';
    ripple.style.top  = (e.clientY - 5) + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => {
      window.location.href = 'home.html';
    }, 300);
  });
</script>
</body>
</html>
