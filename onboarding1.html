<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding – Step 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:     #7c5cbf;
      --purple-light: #a07de0;
      --purple-bg:  #ede9f8;
      --bg:         #eef1fb;
      --card-bg:    #ffffff;
      --text-dark:  #1a1a2e;
      --text-mid:   #555577;
      --text-soft:  #9999bb;
      --orange:     #f5a623;
      --orange-bg:  #fef3e2;
      --teal-bg:    #e0f5f5;
      --progress-h: clamp(6px, 0.5vw, 10px);
      --radius-card: clamp(16px, 1.5vw, 24px);
      --radius-btn:  clamp(20px, 2vw, 40px);
    }

    html, body {
      height: 100%;
      background: #d8daf0;
      font-family: 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Outer shell ── */
    .shell {
      width: min(100vw, 820px);
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Decorative blobs ── */
    .blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .blob-pink   { width: clamp(90px,14vw,180px); height: clamp(90px,14vw,180px); border: clamp(5px,0.6vw,9px) solid #f4b8c8; top: clamp(120px,18%,220px); left: clamp(-60px,-8vw,-30px); background: transparent; z-index: 0; }
    .blob-gold   { width: clamp(80px,12vw,150px); height: clamp(80px,12vw,150px); border: clamp(5px,0.6vw,9px) solid #f5d78e; top: clamp(30px,4%,60px); right: clamp(-50px,-7vw,-20px); background: transparent; z-index: 0; }
    .blob-teal   { width: clamp(80px,12vw,150px); height: clamp(80px,12vw,150px); background: #b2e8e8; border-radius: 50%; bottom: clamp(120px,14%,200px); right: clamp(-50px,-7vw,-20px); opacity: .55; z-index: 0; }
    .blob-purple { width: clamp(100px,16vw,200px); height: clamp(100px,16vw,200px); background: #c8b8f0; border-radius: 50%; bottom: clamp(-60px,-8vw,-30px); left: clamp(-60px,-8vw,-30px); opacity: .45; z-index: 0; }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: clamp(10px,1.5vw,20px);
      padding: clamp(16px,2.5vw,32px) clamp(20px,3vw,40px) clamp(10px,1.5vw,20px);
    }
    .back-btn {
      width: clamp(36px,5vw,56px);
      height: clamp(36px,5vw,56px);
      border-radius: 50%;
      background: var(--card-bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
      flex-shrink: 0;
    }
    .back-btn svg { width: clamp(14px,2vw,22px); height: clamp(14px,2vw,22px); }

    .progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: clamp(8px,1vw,14px);
    }
    .progress-track {
      flex: 1;
      height: var(--progress-h);
      background: #d5d5e8;
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 20%;
      background: var(--purple);
      border-radius: 100px;
    }
    .progress-label {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: clamp(13px,1.4vw,18px);
      color: var(--purple);
      white-space: nowrap;
    }

    /* ── Hero section ── */
    .hero {
      position: relative;
      padding: clamp(12px,1.5vw,24px) clamp(20px,3vw,40px) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .step-label {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: clamp(16px,2.2vw,28px);
      color: var(--purple-light);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: clamp(2px,0.3vw,6px);
    }
    .step-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: clamp(28px,4.5vw,58px);
      color: var(--text-dark);
      margin-bottom: clamp(4px,0.5vw,10px);
      text-align: center;
    }
    .step-sub {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: clamp(13px,1.5vw,20px);
      color: var(--text-mid);
      text-align: center;
    }

    /* ── Mascot ── */
    .mascot-wrap {
      position: absolute;
      right: clamp(16px,3vw,48px);
      top: clamp(-10px,-1vw,0px);
      width: clamp(120px,18vw,240px);
      pointer-events: none;
      z-index: 2;
    }
    .mascot-wrap img {
      width: 100%;
      height: auto;
      display: block;
      /* Give the mascot little legs via CSS – the image is upper body only */
      filter: drop-shadow(0 8px 18px rgba(120,80,200,.25));
    }


    /* ── Cards section ── */
    .cards {
      padding: clamp(20px,2.5vw,40px) clamp(20px,3vw,40px);
      display: flex;
      flex-direction: column;
      gap: clamp(12px,1.5vw,22px);
      z-index: 1;
      position: relative;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: clamp(14px,2vw,26px) clamp(16px,2.5vw,32px);
      display: flex;
      align-items: center;
      gap: clamp(14px,2vw,28px);
      box-shadow: 0 4px 18px rgba(80,60,160,.07);
    }

    .card-icon {
      width: clamp(48px,7vw,90px);
      height: clamp(48px,7vw,90px);
      border-radius: clamp(12px,1.4vw,20px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-icon svg { width: 55%; height: 55%; }
    .card-icon.orange { background: var(--orange-bg); }
    .card-icon.violet { background: var(--purple-bg); }
    .card-icon.teal   { background: var(--teal-bg); }

    .card-body { flex: 1; }
    .card-label {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: clamp(15px,1.8vw,24px);
      color: var(--text-dark);
      margin-bottom: clamp(3px,0.4vw,7px);
    }
    .card-input {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: clamp(12px,1.4vw,18px);
      color: var(--text-soft);
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
    }
    .card-input::placeholder { color: var(--text-soft); }

    .card-action {
      color: var(--text-soft);
      flex-shrink: 0;
    }
    .card-action svg { width: clamp(18px,2vw,28px); height: clamp(18px,2vw,28px); }

    /* Pronoun select */
    .card-select {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: clamp(12px,1.4vw,18px);
      color: var(--text-soft);
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      cursor: pointer;
      appearance: none;
    }

    /* ── CTA ── */
    .cta-wrap {
      padding: clamp(10px,1.5vw,20px) clamp(20px,3vw,40px) clamp(8px,1vw,14px);
    }
    .cta-btn {
      width: 100%;
      padding: clamp(16px,2.2vw,28px);
      background: #111;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: clamp(17px,2.2vw,28px);
      border: none;
      border-radius: var(--radius-btn);
      cursor: pointer;
      letter-spacing: .03em;
      transition: background .2s, transform .12s;
    }
    .cta-btn:hover  { background: #2a2a2a; }
    .cta-btn:active { transform: scale(.98); }

    .cta-note {
      text-align: center;
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: clamp(11px,1.2vw,16px);
      color: var(--text-soft);
      padding: clamp(8px,1vw,14px) 0 clamp(16px,2vw,28px);
    }

    /* ── Responsive: hero row layout on wide screens ── */
    @media (min-width: 600px) {
      .hero-text {
        text-align: center;
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      .mascot-wrap { width: 100px; right: 10px; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Decorative blobs -->
  <div class="blob blob-pink"></div>
  <div class="blob blob-gold"></div>
  <div class="blob blob-teal"></div>
  <div class="blob blob-purple"></div>

  <!-- Top bar -->
  <div class="topbar">
 <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <span class="progress-label">1/5</span>
    </div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <!-- Mascot positioned top-right of hero -->
    <div class="mascot-wrap" aria-hidden="true">
      <img src="assets/purpleflower1.png" alt="Purple flower mascot" />
      <div class="mascot-legs">
        <div>
          <div class="leg"></div>
          <div class="foot"></div>
        </div>
        <div>
          <div class="leg"></div>
          <div class="foot"></div>
        </div>
      </div>
    </div>

    <div class="hero-text">
      <p class="step-label">Step 1</p>
      <h1 class="step-title">Welcome</h1>
      <p class="step-sub">Let's get to know you a little better</p>
    </div>
  </div>

  <!-- Cards -->
  <div class="cards">

    <!-- Name -->
    <div class="card">
      <div class="card-icon orange">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="7" r="3" fill="#f5a623"/>
          <circle cx="17" cy="7" r="2.5" fill="#f5a623" opacity=".7"/>
          <path d="M2 21c0-4 3.134-7 7-7h4c3.866 0 7 3 7 7" stroke="#f5a623" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="card-body">
        <p class="card-label">What should we call you?</p>
        <input class="card-input" type="text" placeholder="Your name...." />
      </div>
    </div>

    <!-- Pronouns -->
    <div class="card">
      <div class="card-icon violet">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="4" fill="#9b7de0"/>
          <path d="M4 20c0-3.314 3.582-6 8-6s8 2.686 8 6" stroke="#9b7de0" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="card-body">
        <p class="card-label">What are your pronouns?</p>
        <select class="card-select">
          <option value="" disabled selected>Your pronouns</option>
          <option>she/her</option>
          <option>he/him</option>
          <option>they/them</option>
          <option>she/they</option>
          <option>he/they</option>
          <option>prefer not to say</option>
        </select>
      </div>
      <div class="card-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>

    <!-- Birthday -->
    <div class="card">
      <div class="card-icon teal">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="5" width="18" height="16" rx="3" fill="#7dd5d5" opacity=".35"/>
          <rect x="3" y="5" width="18" height="16" rx="3" stroke="#3ab8b8" stroke-width="2" fill="none"/>
          <path d="M16 3v4M8 3v4M3 10h18" stroke="#3ab8b8" stroke-width="2" stroke-linecap="round"/>
          <rect x="7" y="13" width="3" height="3" rx="1" fill="#3ab8b8"/>
          <rect x="14" y="13" width="3" height="3" rx="1" fill="#3ab8b8"/>
        </svg>
      </div>
      <div class="card-body">
        <p class="card-label">When is your birthday?</p>
        <input class="card-input" type="text" placeholder="May 15th, 2026" />
      </div>
      <div class="card-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
      </div>
    </div>

  </div>

  <!-- CTA -->
  <div class="cta-wrap">
    <button class="cta-btn" onclick="window.location.href='onboarding2.html'" >Begin</button>
</div>
</body>
</html>
