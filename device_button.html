<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FEEL — My Device Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --card-bg: #fff;
    --radius-lg: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow-x: hidden; }

  body {
    background-color: #F0F7FD;
    background-image: url('assets/JournalGradientBackground.png');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    font-family: 'Roboto', sans-serif;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 100px 16px;
    overflow: hidden;  /* add this */
  }

  /* ── Card ── */
  .device-card {
    width: 100%;
    flex: 1;
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    position: relative; 
  }

  /* ── Header ── */
  .card-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 24px 8px;
    position: relative;
    flex-shrink: 0;
  }

  .back-btn {
    position: absolute;
    left: 24px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 28px;
    color: #1a1a1a;
    font-weight: 300;
    line-height: 1;
    padding: 4px;
  }

  .page-title {
    font-family: 'Nunito Sans', sans-serif;
    font-size: 26px;
    font-weight: 900;
    color: #1a1a1a;
    text-align: center;
  }

  .page-subtitle {
    font-size: 13px;
    color: #aaa;
    text-align: center;
    padding: 4px 40px 0;
    line-height: 1.4;
    flex-shrink: 0;
  }

  /* ── Main content area ── */
  .content-area {
    width: 100%;
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    min-height: 500px;
    touch-action: none;
  }

  /* ── Device image — left overflow ── */
  .device-img-wrap {
    position: absolute;
    left: -40%;
    top: 50%;
    transform: translateY(-50%);
    width: 75%;
    z-index: 2;
    pointer-events: none;
  }

  .device-img-wrap img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 12px 32px rgba(0,0,0,0.15));
  }

  /* ── Arc + emotion list ── */
.arc-area {
  position: absolute;
  right: 0px;
  top: 0px;
  bottom: 0;
  left: 0;
  display: flex;
  align-items: center;
    isolation: isolate;
}

    .arc-img {
    position: absolute;
    left: -210px;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    pointer-events: none;
    z-index: 1;
    }

    .emotion-list {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    z-index: 10;
    }

  .emotion-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
  }

  .emotion-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .emotion-name {
    font-family: 'Nunito Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #aaa;
    transition: all 0.2s;
  }

  /* Active state */
  .emotion-row.active .emotion-dot {
    width: 14px;
    height: 14px;
    transform: scale(1.2);
  }

  .emotion-row.active .emotion-name {
    font-size: 28px;
    font-weight: 900;
    color: inherit;
  }

  .edit-icon {
    margin-left: auto;
    opacity: 1;
    font-size: 18px;
    flex-shrink: 0;
  }


  /* Active row card pill */
  .emotion-row.active {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 10px 14px;
    margin: 4px 0;
  }

  /* Picker overlay */
  .picker-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 400;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    align-items: flex-end;
    justify-content: center;
    padding: 0 16px 40px;
  }
  .picker-overlay.active { display: flex; animation: slideUp 0.3s ease; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: none; }
  }

  .picker-card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 32px;
    padding: 24px 20px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }

  .picker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .picker-title {
    font-family: 'Nunito Sans', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: #1a1a1a;
  }

  .picker-close {
    background: #f3f4f6;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 16px;
    color: #888;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .picker-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .picker-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 8px;
    border-radius: 16px;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
    border: 2px solid transparent;
  }

  .picker-item:hover { background: #f8f9fa; transform: scale(1.04); }
  .picker-item.selected { border-color: currentColor; background: #f8f9fa; }

  .picker-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
  }

  .picker-name {
    font-size: 12px;
    font-weight: 600;
    color: #555;
    text-align: center;
    font-family: 'Roboto', sans-serif;
  }

  .picker-done {
    width: 100%;
    margin-top: 18px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Roboto', sans-serif;
  }
</style>
</head>
<body>

<div class="page">
  <div class="device-card">

    <!-- Header -->
    <div class="card-header">
      <button class="back-btn" onclick="window.location.href='emotions.html'">‹</button>
      <span class="page-title">My Device</span>
    </div>
    <p class="page-subtitle">What emotion would you like to track<br>on your Journey?</p>

<!-- Main content -->
<div class="content-area">

  <!-- Device image — overflows left -->
  <div class="device-img-wrap">
    <img id="flower-img-prev" src="assets/flower_redactive.png" style="width:1000px;height:1000px;object-fit:contain;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
    <img id="flower-img-curr" src="assets/flower_redactive.png" style="width:1000px;height:1000px;object-fit:contain;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
  </div>

  <!-- Arc png + emotion list -->
  <div class="arc-area">
    <img src="assets/arc.png" class="arc-img" alt="">
    <div class="emotion-list" id="emotion-list"></div>
  </div>

</div>

<!-- Emotion picker overlay -->
<div class="picker-overlay" id="picker-overlay" onclick="handlePickerOverlay(event)">
  <div class="picker-card">
    <div class="picker-header">
      <span class="picker-title">Choose emotion for <span id="picker-button-name">Button</span></span>
      <button class="picker-close" onclick="closePicker()">✕</button>
    </div>
    <div class="picker-grid" id="picker-grid"></div>
    <button class="picker-done" onclick="closePicker()">Done</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
const EMOTIONS = [
  { name: 'Happiness',  color: '#FAC038' },
  { name: 'Calmness',   color: '#67C8AF' },
  { name: 'Anger',      color: '#EB585A' },
  { name: 'Sadness',    color: '#77DEF8' },
  { name: 'Envy',       color: '#B293EB' },
  { name: 'Fear',       color: '#711A79' },
  { name: 'Disgust',    color: '#6F8919' },
  { name: 'Contempt',   color: '#0D555A' },
  { name: 'Admiration', color: '#F9EC43' },
  { name: 'Pride',      color: '#931C4A' },
  { name: 'Nostalgia',  color: '#67C8AF' },
  { name: 'Boredom',    color: '#33263E' },
];

// 5 button slots matching the 5 petals on the flower
const BUTTONS = [
  { id: 0, label: 'Button 1', emotion: 'Happiness' },
  { id: 1, label: 'Button 2', emotion: 'Calmness'  },
  { id: 2, label: 'Button 3', emotion: 'Anger'     },
  { id: 3, label: 'Button 4', emotion: 'Sadness'   },
  { id: 4, label: 'Button 5', emotion: 'Envy'      },
];

let activeButton = 2; // Anger selected by default (matching screenshot)
let editingButton = null;

function getEmotion(name) {
  return EMOTIONS.find(e => e.name === name) || EMOTIONS[0];
}

// put these BEFORE renderList()
const EMOTION_FLOWERS = {
  '#67C8AF': 'assets/flower_greenactive.png',
  '#77DEF8': 'assets/flower_blueactive.png',
  '#B293EB': 'assets/flower_purpleactive.png',
  '#FAC038': 'assets/flower_yellowactive.png',
  '#EB585A': 'assets/flower_redactive.png',
};

function getFlowerForActive() {
  const emo = getEmotion(BUTTONS[activeButton].emotion);
  return EMOTION_FLOWERS[emo.color] || 'assets/flower_redactive.png';
}
function updateFlower(newIndex, oldIndex) {
  const newSrc = getFlowerForActive();
  const curr = document.getElementById('flower-img-curr');
  const prev = document.getElementById('flower-img-prev');

  if (curr.src.includes(newSrc.split('/').pop())) return;

  // special case overrides
  const overrides = [
  { from: 0, to: 4, dir: -1 },  // Happiness → Envy: go up
  { from: 4, to: 0, dir: 1 },   // Envy → Happiness: go down
  { from: 4, to: 0, dir: -1 },  // Envy → Happiness: reverse
  { from: 0, to: 4, dir: -1 },   // Happiness → Envy: reverse
  ];

  const override = overrides.find(o => o.from === oldIndex && o.to === newIndex);
  const direction = override ? override.dir : (newIndex > oldIndex ? -1 : 1);

  const rotOut = direction * 15;
  const rotIn  = direction * -15;

  prev.src = curr.src;
  gsap.set(prev, { opacity: 1, rotation: 0, scale: 1 });

  curr.src = newSrc;
  gsap.set(curr, { opacity: 0, rotation: rotIn, scale: 0.9 });

  gsap.to(prev, { opacity: 0, rotation: rotOut, scale: 0.9, duration: 0.4, ease: 'power2.in' });
  gsap.to(curr, { opacity: 1, rotation: 0, scale: 1, duration: 0.4, ease: 'power2.out', delay: 0.15 });
}

// then renderList() and at the very bottom:
renderList();
initNav('emotions');
function renderList() {
  const list = document.getElementById('emotion-list');
  list.innerHTML = '';

  const positions = [
    { top: '9%',  left: '52%' },
    { top: '27%', left: '65%' },
    { top: '50%', left: '70%' },
    { top: '73%', left: '65%' },
    { top: '91%', left: '52%' },
  ];

  BUTTONS.forEach((btn, i) => {
    const emo = getEmotion(btn.emotion);
    const isActive = i === activeButton;
    const pos = positions[i];

    const row = document.createElement('div');
    row.style.cssText = `
      position: absolute;
      left: ${pos.left};
      top: ${pos.top};
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
      z-index: 10;
    `;

    if (isActive) {
      row.innerHTML = `
        <div style="width:14px;height:14px;border-radius:50%;background:${emo.color};flex-shrink:0;"></div>
        <span style="font-family:'Nunito Sans',sans-serif;font-size:28px;font-weight:900;color:${emo.color};white-space:nowrap;">${btn.emotion}</span>
       <span class="edit-icon" style="margin-left:40px;">
          <img src="assets/edit_icon.png" style="width:20px;height:20px;object-fit:contain;">
        </span>
        </span>
        <div style="position:absolute;inset:-10px -14px;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,0.08);z-index:-1;"></div>
      `;
    } else {
      row.innerHTML = `
        <div style="width:10px;height:10px;border-radius:50%;background:${emo.color};flex-shrink:0;"></div>
        <span style="font-family:'Nunito Sans',sans-serif;font-size:16px;font-weight:700;color:${emo.color};white-space:nowrap;">${btn.emotion}</span>
      `;
    }

    // single click handler with direction tracking
    row.onclick = () => {
      const prev = activeButton;
      activeButton = i;
      updateFlower(i, prev);
      renderList();
    };

    const editIcon = row.querySelector('.edit-icon');
    if (editIcon) {
      editIcon.onclick = (e) => { e.stopPropagation(); openPicker(i); };
    }

    list.appendChild(row);
  });
}

renderList();
initNav('emotions');

/* ── Picker ── */
function openPicker(buttonIdx) {
  editingButton = buttonIdx;
  const btn = BUTTONS[buttonIdx];
  document.getElementById('picker-button-name').textContent = btn.label;

  const grid = document.getElementById('picker-grid');
  grid.innerHTML = '';

  EMOTIONS.forEach(emo => {
    const item = document.createElement('div');
    item.className = 'picker-item' + (btn.emotion === emo.name ? ' selected' : '');
    item.style.color = emo.color;
    item.innerHTML = `
      <div class="picker-dot" style="background:${emo.color};"></div>
      <span class="picker-name">${emo.name}</span>
    `;
    item.onclick = () => {
      BUTTONS[buttonIdx].emotion = emo.name;
      grid.querySelectorAll('.picker-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      renderList();
    };
    grid.appendChild(item);
  });

  document.getElementById('picker-overlay').classList.add('active');
}

function closePicker() {
  document.getElementById('picker-overlay').classList.remove('active');
  editingButton = null;
}

function handlePickerOverlay(e) {
  if (e.target === document.getElementById('picker-overlay')) closePicker();
}

renderList();
</script>

<!-- Radial nav -->
<script>

function getFlowerForActive() {
  const emo = getEmotion(BUTTONS[activeButton].emotion);
  return EMOTION_FLOWERS[emo.color] || 'assets/flower_redactive.png';
}

function updateFlower(newIndex, oldIndex) {
  const newSrc = getFlowerForActive();
  const curr = document.getElementById('flower-img-curr');
  const prev = document.getElementById('flower-img-prev');
  if (curr.src.includes(newSrc.split('/').pop())) return;

  const overrides = [
    { from: 0, to: 4, dir: 1 },
    { from: 4, to: 0, dir: -1 },
  ];
  const override = overrides.find(o => o.from === oldIndex && o.to === newIndex);
  const direction = override ? override.dir : (newIndex > oldIndex ? -1 : 1);
  const rotOut = direction * 15;
  const rotIn  = direction * -15;

  prev.src = curr.src;
  gsap.set(prev, { opacity: 1, rotation: 0, scale: 1 });
  curr.src = newSrc;
  gsap.set(curr, { opacity: 0, rotation: rotIn, scale: 0.9 });
  gsap.to(prev, { opacity: 0, rotation: rotOut, scale: 0.9, duration: 0.4, ease: 'power2.in' });
  gsap.to(curr, { opacity: 1, rotation: 0, scale: 1, duration: 0.4, ease: 'power2.out', delay: 0.15 });
}

let touchStartY = 0;
let mouseStartY = 0;
let isDragging = false;

function handleSwipe(diff) {
  if (Math.abs(diff) < 30) return;
  const swipeUpOrder   = [2, 1, 0, 4, 3];
  const swipeDownOrder = [2, 3, 4, 0, 1];
  const prev = activeButton;
  const order = diff > 0 ? swipeUpOrder : swipeDownOrder;
  const currentPos = order.indexOf(activeButton);
  const nextPos = (currentPos + 1) % order.length;
  activeButton = order[nextPos];
  updateFlower(activeButton, prev);
  renderList();
}

document.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (document.getElementById('picker-overlay').classList.contains('active')) return;
  handleSwipe(touchStartY - e.changedTouches[0].clientY);
});

document.addEventListener('mousedown', (e) => {
  mouseStartY = e.clientY;
  isDragging = true;
});

window.addEventListener('mouseup', (e) => {
  if (!isDragging) return;
  isDragging = false;
  if (document.getElementById('picker-overlay').classList.contains('active')) return;
  handleSwipe(mouseStartY - e.clientY);
});

function initNav(activePage) {
  // ... your existing initNav code
}

initNav('emotions');
</script>

</body>
</html>
