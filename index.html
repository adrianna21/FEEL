<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FEEL – Just Start Here</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #dde8f0;
      font-family: 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Outer shell ── */
    .shell {
      width: min(100vw, 820px);
      min-height: 100vh;
      background: #dde8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(24px, 3vw, 48px) clamp(16px, 3vw, 40px) clamp(20px, 2.5vw, 36px);
      gap: clamp(16px, 2vw, 28px);
    }

    /* ── Card ── */
    .card {
      width: 100%;
      flex: 1;
      border-radius: clamp(20px, 2.5vw, 36px);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
    }

    /* Background image fills the card */
    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /* Content sits above the bg */
    .card-content {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(28px, 4vw, 56px) clamp(20px, 3vw, 48px) clamp(24px, 3.5vw, 44px);
      flex: 1;
      justify-content: space-between;
    }

    /* ── Headline ── */
    .headline {
      font-family: 'Nunito', sans-serif;
      font-style: normal;
      font-weight: 200;
      font-size: clamp(50px, 4.5vw, 56px);
      color: #111;
      text-align: center;
      margin-bottom: clamp(10px, 1.2vw, 18px);
      transform: translateY(150px);
      line-height: 40px; 

    }

    .tagline {
      font-family: 'Nunito', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: clamp(40px, 3.8vw, 48px);
      text-align: center;
      margin-bottom: clamp(16px, 2.5vw, 36px);
      background: linear-gradient(90deg, #F6A952 0%, #EAA4A6 36.82%, #BBA1D4 61.9%, #1DCBD6 86.98%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transform: translateY(140px);
    }

    /* ── Mascot ── */
    .mascot-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      transform: translateY(-30px);
    }

    .mascot-wrap img {
      width: min(72%, 340px);
      height: auto;
      display: block;
      filter: drop-shadow(0 12px 32px rgba(0,0,0,.12));
      /* slight float animation */
      /* animation: float 3.6s ease-in-out infinite; */
    }

    @keyframes float {
      0%, 100% { transform: translateY(0);   }
      50%       { transform: translateY(-10px); }
    }

    /* ── Badge ── */
    .badge {
      background: rgba(255, 255, 255, 0.309);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 100px;
      padding: clamp(8px,1vw,14px) clamp(20px,2.5vw,36px);
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      font-size: clamp(12px,1.4vw,18px);
      color: #ffffff;
      margin-bottom: clamp(14px,1.8vw,26px);
      letter-spacing: .01em;
    }

    /* ── Body copy ── */
    .body-copy {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: clamp(13px,1.5vw,19px);
      color: #fff;
      text-align: center;
      line-height: 1.65;
      max-width: 560px;
      line-height: normal;
    }

    /* ── CTA area ── */
    .cta-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px,1.2vw,18px);
      flex-shrink: 0;
    }

    .begin-btn {
      width: 100%;
      padding: clamp(16px,2.2vw,26px) clamp(20px,2.5vw,32px);
      background: #111;
      color: #fff;
      font-family: 'Roboto', sans-serif;
      font-style: normal;
      font-weight: 500;
      line-height: normal;
      font-size: clamp(18px,2.4vw,30px);
      border: none;
      border-radius: clamp(20px,2.5vw,40px);
      cursor: pointer;
      letter-spacing: .02em;
      transition: background .2s, transform .12s;
    }
    .begin-btn:hover  { background: #2b2b2b; }
    .begin-btn:active { transform: scale(.98); }

    .learn-link {
      font-family: 'Roboto', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 16px;
      color: #000000;
      text-align: center;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
    }
    .learn-link:hover { opacity: .75; }

    .mascot-wrap { visibility: hidden; }

    /* ── Responsive tweaks ── */
    @media (max-height: 700px) {
      .mascot-wrap img { width: min(55%, 220px); }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Main card -->
  <div class="card">
    <!-- Background -->
    <img class="card-bg" src="assets/bg_onboarding.png" alt="" aria-hidden="true" />

    <div class="card-content">
      <h1 class="headline">You don't have<br>to figure it all out</h1>
      <p class="tagline">Just Start Here.</p>
      

   
      <!-- Mascot -->
      <!-- 
      <div class="mascot-wrap">
        <img src="assets/whiteflower_peacesign.png" alt="Friendly flower mascot giving peace signs" />
      </div> 
      -->
      <div class="mascot-wrap">...</div>
      
      <!-- Badge + body copy -->
      <div class="badge">Made by humans, for humans</div>
      <p class="body-copy">
        We all feel things. FEEL helps you figure out what those
        things actually are. A quick check-in, a little reflection, and
        over time you'll have a clearer picture of you.
      </p>
    </div>
  </div>

  <!-- CTA outside the card -->
  <div class="cta-area">
    <button class="begin-btn" onclick="window.location.href='onboarding1.html'">Begin</button>
    <button class="learn-link">Learn more about us</button>
  </div>

</div>
</body>
</html>
