  /* ── Journal Page ── */
  .journal-page {
    position: relative;
    min-height: 100vh;
  }

  /* Centered content wrapper */
  .page-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Sticky header */
  .journal-page-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: transparent;
    padding: 54px 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .journal-page-header h2 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    text-align: center;
    flex: 1;
  }
  .journal-page-header .smiley {
    position: absolute;
    right: 0;
  }

  /* Add Entry FAB */
  .add-entry-fab {
    position: fixed;
    bottom: 36px;
    right: clamp(16px, 4vw, 48px);
    z-index: 500;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: Roboto, sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .add-entry-fab:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
  .add-entry-fab:active { transform: translateY(0); }



  /* Filter row */
  .journal-filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 0 16px;
    scrollbar-width: none;
  }
  .journal-filter-row::-webkit-scrollbar { display: none; }
  .filter-pill {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 40px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-family: Roboto, sans-serif;
    opacity: 0.55;
    transition: opacity 0.15s, transform 0.12s;
  }
  .filter-pill.active { opacity: 1; transform: scale(1.04); }
  .filter-pill[data-tag="All"]           { background: #595F64; color: #fff; box-shadow: -3px 3px 6px rgba(89,95,100,0.35); }
  .filter-pill[data-tag="Personal"]      { background: #D6F5FD; color: #fff; box-shadow: -3px 3px 6px rgba(58,198,233,0.3); }
  .filter-pill[data-tag="School"]        { background: #FFEED4; color: #fff; box-shadow: -3px 3px 6px rgba(252,183,80,0.3); }
  .filter-pill[data-tag="Relationships"] { background: #FFDBDB; color: #fff; box-shadow: -3px 3px 6px rgba(240,165,167,0.3); }
  .filter-pill[data-tag="Health"]        { background: #DEF4E2; color: #fff; box-shadow: -3px 3px 6px rgba(95,198,114,0.3); }
  .filter-pill[data-tag="Growth"]        { background: #F1E9FF; color: #fff; box-shadow: -3px 3px 6px rgba(178,147,235,0.3); }

  /* Active/selected state per category */
  .filter-pill.active[data-tag="All"]           { background: #595F64; color: #fff; }
  .filter-pill.active[data-tag="Personal"]      { background: #3AC6E9; color: #fff; }
  .filter-pill.active[data-tag="School"]        { background: #FCB750; color: #fff; }
  .filter-pill.active[data-tag="Relationships"] { background: #FCB750; color: #fff; }
  .filter-pill.active[data-tag="Health"]        { background: #5FC672; color: #fff; }
  .filter-pill.active[data-tag="Growth"]        { background: #B293EB; color: #fff; }

  .journal-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px 0 120px;
  }

  @media (min-width: 640px) {
    .page-inner { padding: 0 32px; }
  }

  @media (min-width: 1100px) {
    .page-inner { max-width: 1200px; padding: 0 48px; }
  }

  /* ── Header — left aligned ── */
  .journal-page-header {
    padding: 54px 0 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .journal-page-header-left { display: flex; flex-direction: column; gap: 4px; }
  .journal-page-header h2 {
    font-size: clamp(28px, 6vw, 46px);
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.5px;
    text-align: left;
    font-family: Nunito, sans-serif;
    font-style: normal;
  }
  .journal-subtitle {
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.85);
    font-family: Nunito, sans-serif;
  }
  .help-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    border: 2px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 6px;
    font-family: Roboto, sans-serif;
  }

  /* ── Cards ── */
  .journal-list-card {
    border-radius: 22px;
    background: #fff;
    padding: 16px 14px 20px 14px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }
  .journal-list-card:hover { }

  /* Date block */
  .jcard-date-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 62px;
    min-width: 62px;
    height: 76px;
    border-radius: 14px;
    flex-shrink: 0;
    padding: 6px 4px;
  }
  .jcard-day-name {
    font-size: 10px;
    font-weight: 700;
    color: #1a1a1a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: Nunito, sans-serif;
    opacity: 0.7;
  }
  .jcard-day-num {
    font-size: 28px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1;
    font-family: Nunito, sans-serif;
  }
  .date-Personal      { background: #E8F8FD; }
  .date-Work          { background: #FFF4E5; }
  .date-School        { background: #FFEED4; }
  .date-Relationships { background: #FDE8E9; }
  .date-Health        { background: #E8F5EA; }
  .date-Growth        { background: #F0EAFD; }

  /* Middle content */
  .jcard-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  .jcard-title {
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: Roboto, sans-serif;
  }
  .jcard-body-text {
    font-size: 11px;
    color: #999;
    line-height: 1.45;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    font-family: Roboto, sans-serif;
  }
  .jcard-date-text {
    font-size: 10px;
    color: #bbb;
    margin-top: 3px;
    font-family: Roboto, sans-serif;
  }

  /* Right side — tag and chevron horizontal */
  .jcard-right {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .jcard-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    color: #555;
    font-family: Roboto, sans-serif;
    white-space: nowrap;
    width: fit-content;
  }
  /* Tag bg matches date block color */
  .tag-bg-Personal      { background: #E8F8FD; }
  .tag-bg-Work          { background: #FFF4E5; }
  .tag-bg-School        { background: #FFEED4; }
  .tag-bg-Relationships { background: #FDE8E9; }
  .tag-bg-Health        { background: #E8F5EA; }
  .tag-bg-Growth        { background: #F0EAFD; }

  .jcard-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-Personal     { background: var(--personal); }
  .dot-Work         { background: var(--work); }
  .dot-School       { background: #FCB750; }
  .dot-Relationships{ background: var(--relationships); }
  .dot-Health       { background: var(--health); }
  .dot-Growth       { background: var(--growth); }
  .jcard-month-text {
    font-size: 9px;
    font-weight: 600;
    color: #888;
    font-family: Nunito, sans-serif;
    text-align: center;
    margin-top: 2px;
  }
  .jcard-chevron { font-size: 36px; color: #ccc; line-height: 1; }
  /* Category colored left shadow */
  .shadow-Personal      { box-shadow: -4px 0 0 0 #77DEF8, 0 4px 16px rgba(119,222,248,0.25), 0 1px 4px rgba(0,0,0,0.06); }
  .shadow-School        { box-shadow: -4px 0 0 0 #FCB750, 0 4px 16px rgba(252,183,80,0.25), 0 1px 4px rgba(0,0,0,0.06); }
  .shadow-Relationships { box-shadow: -4px 0 0 0 #F0A5A7, 0 4px 16px rgba(240,165,167,0.25), 0 1px 4px rgba(0,0,0,0.06); }
  .shadow-Health        { box-shadow: -4px 0 0 0 #9DD2A6, 0 4px 16px rgba(157,210,166,0.25), 0 1px 4px rgba(0,0,0,0.06); }
  .shadow-Growth        { box-shadow: -4px 0 0 0 #B293EB, 0 4px 16px rgba(178,147,235,0.25), 0 1px 4px rgba(0,0,0,0.06); }

  /* Category icon on the right */
  .jcard-icon {
    width: 96px;
    height: 96px;
    border-radius: 12px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .jcard-icon-health {
    width: 110px;
    height: 110px;
  }
  .jcard-right-stack {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 30px;
    flex-shrink: 0;
    align-self: center;
    margin-left: 60px;
  }

  /* ── Swipe-to-delete wrapper ── */
  .card-swipe-wrapper {
    position: relative;
    border-radius: 22px;
  }
  .card-swipe-wrapper .journal-list-card {
    border-radius: 22px;
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform;
    touch-action: pan-y;
    position: relative;
    z-index: 2;
  }
  .card-swipe-wrapper.swiped .journal-list-card {
    transform: translateX(-11%);
  }
  .delete-btn {
    position: absolute;
    right: -4px;
    top: 50%;
    transform: translateY(-50%) scale(0.5);
    width: 64px;
    height: 64px;
    border-radius: 500px;
    background: #EB585A;
    box-shadow: 0 4px 6px 0 rgba(0,0,0,0.15);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 1;
  }
  .card-swipe-wrapper.swiped .delete-btn {
    opacity: 1;
    transform: translateY(-50%) scale(1);
  }
  .delete-btn svg {
    width: 26px;
    height: 26px;
  }

  /* Add Entry FAB */
  .add-entry-fab {
    position: fixed;
    bottom: 100px;
    right: clamp(16px, 4vw, 48px);
    z-index: 300;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: Roboto, sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.25s;
  }
  .add-entry-fab:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
  .add-entry-fab:active { transform: translateY(0); }
  .add-entry-fab.blurred {
    filter: blur(4px);
    pointer-events: none;
  }

  /* ── Entry Screen — Popup Overlay ── */
  .screen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 400;
    background: rgba(255, 255, 255, 0.36);
    backdrop-filter: blur(12.5px);
    -webkit-backdrop-filter: blur(12.5px);
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }
  .screen.active { display: flex; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  /* Popup container */
  .popup-card {
    width: 100%;
    max-width: 520px;
    border-radius: 48px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: 92vh;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }

  /* Header */
  .popup-header {
    position: relative;
    border-radius: 48px 48px 0 0;
    overflow: hidden;
    flex-shrink: 0;
  }
  .popup-header-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #F5A623 0%, #E8906A 20%, #C7614A 35%, #9B6EA8 55%, #4ABCD4 75%, #77DEF8 100%);
    filter: blur(0px);
  }
  .popup-header-white {
    position: relative;
    background: transparent;
    padding: 28px 24px 20px;
    z-index: 1;
  }
  .popup-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .popup-close-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #1a1a1a;
    font-weight: 500;
    font-family: Roboto, sans-serif;
    flex-shrink: 0;
  }
  .popup-title {
    font-family: Roboto, sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    text-align: center;
    flex: 1;
  }
  .popup-date-pill {
    background: #fff;
    border-radius: 50px;
    padding: 11px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: Roboto, sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #333;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .popup-date-pill-left { display: flex; align-items: center; gap: 10px; }
  .popup-date-chevron { color: #818A90; font-size: 16px; }

  /* Body block */
  .popup-body {
    background: #FFFFFF;
    border-radius: 0 0 48px 48px;
    padding: 20px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    flex: 1;
  }

  /* Section cards */
  .popup-section {
    border-radius: 25px;
    border: none;
    background: #FFF;
    box-shadow: -1px -1px 1px rgba(0,0,0,0.012), 2px 2px 2px rgba(0,0,0,0.06);
    padding: 16px 18px;
  }

  /* Section labels */
  .section-label {
    color: #818A90;
    font-family: Roboto, sans-serif;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
  }

  /* Emotions */
  .emotions-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .emotions-scroll::-webkit-scrollbar { display: none; }
  .emotion-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; cursor: pointer; }
  .flower-wrap { width: 56px; height: 56px; }
  .flower-wrap svg { width: 56px; height: 56px; }
  .emotion-label { font-size: 11px; color: #818A90; text-align: center; font-weight: 500; font-family: Roboto, sans-serif; }
  .emotion-val { font-size: 11px; color: #333; font-weight: 600; font-family: Roboto, sans-serif; }

  /* Categories */
  .categories { display: flex; gap: 6px; flex-wrap: nowrap; justify-content: space-between; }
  .cat-pill {
    flex: 1;
    height: 34px;
    padding: 0 4px;
    border-radius: 34.09px;
    border: none;
    background: #F3F6F8;
    font-size: 11px;
    font-weight: 600;
    font-style: normal;
    cursor: pointer;
    color: #818A90;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: Roboto, sans-serif;
    text-align: center;
  }
  .cat-pill[data-cat="Relationships"] { padding: 0 10px; }
  .cat-pill.selected[data-cat="Personal"]     { background: #3AC6E9; color: #fff; }
  .cat-pill.selected[data-cat="Work"]         { background: #FCB750; color: #fff; }
  .cat-pill.selected[data-cat="Relationships"]{ background: #EB585A; color: #fff; }
  .cat-pill.selected[data-cat="Health"]       { background: #68BC7A; color: #fff; }
  .cat-pill.selected[data-cat="Growth"]       { background: #B293EB; color: #fff; }

  /* Text inputs */
  .title-input {
    font-family: Roboto, sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: #818A90;
    text-align: left;
    border: none;
    outline: none;
    width: 100%;
    background: transparent;
  }
  .title-input::placeholder { color: #818A90; font-weight: 600; }
  .body-input {
    font-family: Roboto, sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: #818A90;
    text-align: left;
    border: none;
    outline: none;
    width: 100%;
    min-height: 100px;
    background: transparent;
    resize: none;
    line-height: 1.6;
  }
  .body-input::placeholder { color: #818A90; font-weight: 400; }

  /* Create button */
  .create-btn {
    background: #000000;
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 16px 60px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: Roboto, sans-serif;
    align-self: center;
    margin-top: 4px;
  }

  /* ── Intensity popup ── */
  .intensity-screen {
    background: rgba(255, 255, 255, 0.36);
    backdrop-filter: blur(12.5px);
    -webkit-backdrop-filter: blur(12.5px);
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }
  .intensity-popup-card {
    width: 100%;
    max-width: 520px;
    min-height: 70vh;
    background: #fff;
    border-radius: 40px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .intensity-popup-header {
    display: flex;
    align-items: center;
    padding: 28px 24px 16px;
    justify-content: space-between;
  }
  .intensity-back-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 26px;
    color: #1a1a1a;
    font-weight: 400;
    font-family: Roboto, sans-serif;
    padding: 0;
    line-height: 1;
  }
  .intensity-title {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    font-family: Roboto, sans-serif;
    text-align: center;
    flex: 1;
  }

  .intensity-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 16px 28px 48px;
    flex: 1;
  }

  /* Big flower */
  .big-flower-wrap { width: 320px; height: 320px; }
  .big-flower-wrap svg { width: 320px; height: 320px; }

  /* Custom slider track box */
  .slider-box {
    width: 100%;
    max-width: 360px;
    position: relative;
    height: 42px;
    border-radius: 14px;
    background: #DBDBDB;
    overflow: visible;
    cursor: pointer;
  }

  /* Inner clip for fill and ticks */
  .slider-inner {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    overflow: hidden;
  }

  /* Gradient fill — grows from left */
  .slider-track-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, #8BC6FA 0%, #FCB141 56.73%, #EB585A 100%);
    background-size: 360px 100%;
    background-position: left center;
    transition: width 0.04s linear;
    pointer-events: none;
  }

  /* Tick marks — half height, centered */
  .slider-ticks {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 24px;
    pointer-events: none;
    z-index: 2;
  }
  .slider-tick {
    width: 2.5px;
    height: 45%;
    background: rgba(255,255,255,0.45);
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* Thumb — glass square, starts slightly left of bar, ends slightly right */
  .slider-thumb {
    position: absolute;
    top: 50%;
    left: -10px;
    transform: translateY(-50%);
    width: 62px;
    height: 72px;
    border-radius: 82.8px;
    background: rgba(224, 224, 224, 0.20);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: 1.5px solid rgba(255,255,255,0.55);
    box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Roboto, sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #4F4F4F;
    pointer-events: none;
    z-index: 3;
    transition: left 0.04s linear;
    user-select: none;
  }

  /* Invisible native range on top for interaction */
  .intensity-slider {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    margin: 0;
    z-index: 4;
    -webkit-appearance: none;
    appearance: none;
  }

  .set-btn {
    background: #000;
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 16px 72px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: Roboto, sans-serif;
  }
</style>

/* ── Filter row init ── */
function initFilterRow() {
  const row = document.getElementById('journal-filter-row');
  if (!row || row.dataset.built) return;
  row.dataset.built = '1';
  ['All','Personal','School','Relationships','Health','Growth'].forEach(tag => {
    const pill = document.createElement('button');
    pill.className = 'filter-pill' + (tag === 'All' ? ' active' : '');
    pill.dataset.tag = tag;
    pill.textContent = tag;
    pill.onclick = () => {
      row.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      currentFilter = tag === 'All' ? null : tag;
      renderJournal();
    };
    row.appendChild(pill);
  });
}

    const dayName = parts[0] ? parts[0].trim().slice(0,3).toUpperCase() : '';
    const dayNum = parts[1] ? parts[1].trim().match(/\d+/)?.[0] || '' : '';
    const shortDate = parts[1] && parts[2] ? (parts[1].trim().replace(/\d+(st|nd|rd|th)/, m => m.replace(/(st|nd|rd|th)/,'')) + ',' + parts[2]).trim() : j.date;
    // Build "Apr 2026" from date string
    const rawMonth = parts[2] ? parts[2].trim() : '';
    const monthYear = rawMonth.replace(/^(\w{3})\w*\s(\d{4})$/, '$1 $2');

    const iconSrc = CATEGORY_ICONS[j.tag] || '';
    const card = document.createElement('div');
    card.className = `journal-list-card shadow-${j.tag}`;
    card.innerHTML = `
      <div class="jcard-date-block date-${j.tag}">
        <span class="jcard-day-name">${dayName}</span>
        <span class="jcard-day-num">${dayNum}</span>
        <span class="jcard-month-text">${monthYear}</span>
      </div>
      <div class="jcard-content">
        <div class="jcard-title">${j.title}</div>
        <div class="jcard-body-text">${j.body}</div>
        <div class="jcard-tag tag-bg-${j.tag}" style="margin-top:6px;">
          <span class="jcard-dot dot-${j.tag}"></span>
          ${j.tag}
        </div>
      </div>
      <div class="jcard-right-stack">
        ${iconSrc ? `<img class="jcard-icon${j.tag === 'Health' ? ' jcard-icon-health' : ''}" src="${iconSrc}" alt="${j.tag}"/>` : ''}
        <span class="jcard-chevron">›</span>
      </div>`;
    card.onclick = () => {
      if (wrapper.classList.contains('swiped')) return;
      openEntryScreen(j);
    };

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6M14 11v6"/>
      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    </svg>`;
    delBtn.onclick = (e) => {
      e.stopPropagation();
      wrapper.style.transition = 'opacity 0.25s, transform 0.25s';
      wrapper.style.opacity = '0';
      wrapper.style.transform = 'translateX(-40px)';
      setTimeout(() => {
        journalEntries.splice(idx, 1);
        renderJournal();
      }, 250);
    };

    let startX = 0, startY = 0, isDragging = false, isHorizontal = null;
    function onStart(x, y) { startX = x; startY = y; isDragging = true; isHorizontal = null; }
    function onMove(x, y) {
      if (!isDragging) return;
      const dx = x - startX, dy = y - startY;
      if (isHorizontal === null) {
        if (Math.abs(dx) > 6 || Math.abs(dy) > 6) isHorizontal = Math.abs(dx) > Math.abs(dy);
      }
    }
    function onEnd(x) {
      if (!isDragging || !isHorizontal) { isDragging = false; return; }
      const dx = x - startX;
      isDragging = false;
      if (dx < -40) {
        document.querySelectorAll('.card-swipe-wrapper.swiped').forEach(w => { if (w !== wrapper) w.classList.remove('swiped'); });
        wrapper.classList.add('swiped');
      } else if (dx > 20) {
        wrapper.classList.remove('swiped');
      }
    }

    card.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    card.addEventListener('touchmove',  e => onMove(e.touches[0].clientX, e.touches[0].clientY),  { passive: true });
    card.addEventListener('touchend',   e => onEnd(e.changedTouches[0].clientX));
    card.addEventListener('mousedown',  e => onStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => { if (isDragging) onMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup',   e => { if (isDragging) onEnd(e.clientX); });
    document.addEventListener('click', e => { if (!wrapper.contains(e.target)) wrapper.classList.remove('swiped'); });

    wrapper.appendChild(card);
    wrapper.appendChild(delBtn);
    list.appendChild(wrapper);
  });
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('journal-entry-screen')) closeEntryScreen();
}

/* ── Entry screen ── */
function openEntryScreen(entry) {
  Object.keys(emotionState).forEach(k => delete emotionState[k]);
  selCat = null;

  if (entry) {
    document.getElementById('entry-title').value = entry.title;
    document.getElementById('entry-body').value = entry.body;
    selCat = entry.tag || null;
  } else {
    document.getElementById('entry-title').value = '';
    document.getElementById('entry-body').value = '';
  }

  renderEmotions();
  renderCategories();
  document.getElementById('journal-entry-screen').classList.add('active');
  document.querySelector('.add-entry-fab').classList.add('blurred');
}

function closeEntryScreen() {
  document.getElementById('journal-entry-screen').classList.remove('active');
  document.querySelector('.add-entry-fab').classList.remove('blurred');
}

/* ── Color helpers ── */
function hexToRgb(h) {
  return { r: parseInt(h.slice(1,3),16), g: parseInt(h.slice(3,5),16), b: parseInt(h.slice(5,7),16) };
}
function blendColor(hex, t) {
  const { r, g, b } = hexToRgb(hex);
  // Blend from #F3F6F8 (243,246,248) to the emotion color
  return `rgb(${Math.round(243+(r-243)*t)},${Math.round(246+(g-246)*t)},${Math.round(248+(b-248)*t)})`;
}

/* ── Emotions ── */
function renderEmotions() {
  const row = document.getElementById('emotions-row');
  row.innerHTML = '';

  // Sort: set emotions first (by order they were set, most recent first), unset last
  const sorted = [...EMOTIONS].sort((a, b) => {
    const sa = emotionState[a.name];
    const sb = emotionState[b.name];
    const aSet = sa && sa.set;
    const bSet = sb && sb.set;
    if (aSet && bSet) return (sb.timestamp || 0) - (sa.timestamp || 0);
    if (aSet) return -1;
    if (bSet) return 1;
    return 0;
  });

  sorted.forEach(e => {
    const s = emotionState[e.name] || { intensity: 0, set: false };
    const fill = s.set ? blendColor(e.color, s.intensity / 100) : '#818A90';
    const div = document.createElement('div');
    div.className = 'emotion-item';
    div.onclick = () => openIntensity(e.name);
    div.innerHTML = `
      <div class="flower-wrap">
        <svg viewBox="0 0 166 161" xmlns="http://www.w3.org/2000/svg">
          <path d="${FLOWER_PATH}" fill="${fill === '#818A90' ? '#F3F6F8' : fill}" stroke="${fill === '#818A90' ? '#CCD8DF' : 'none'}" stroke-width="3"/>
        </svg>
      </div>
      <span class="emotion-label">${e.name}</span>
      ${s.set && s.intensity > 0 ? `<span class="emotion-val">${s.intensity}</span>` : ''}`;
    row.appendChild(div);
  });
}

function renderCategories() {
  const row = document.getElementById('categories-row');
  row.innerHTML = '';
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-pill' + (selCat === c ? ' selected' : '');
    btn.setAttribute('data-cat', c);
    btn.textContent = c;
    btn.onclick = () => { selCat = c; renderCategories(); };
    row.appendChild(btn);
  });
}

/* ── Intensity screen ── */
function openIntensity(name) {
  activeEmo = name;
  const s = emotionState[name] || { intensity: 0, set: false };
  document.getElementById('intensity-name').textContent = name;
  document.getElementById('intensity-slider').value = s.intensity;

  // Build tick marks once
  const ticks = document.getElementById('slider-ticks');
  if (!ticks.children.length) {
    for (let i = 0; i < 10; i++) {
      const t = document.createElement('div');
      t.className = 'slider-tick';
      ticks.appendChild(t);
    }
  }

  updateIntensity(s.intensity);
  document.getElementById('intensity-screen').classList.add('active');
}

function closeIntensity() {
  document.getElementById('intensity-screen').classList.remove('active');
  activeEmo = null;
}

function handleIntensityOverlayClick(e) {
  if (e.target === document.getElementById('intensity-screen')) closeIntensity();
}

function setIntensity() {
  if (!activeEmo) return;
  const v = parseInt(document.getElementById('intensity-slider').value);
  emotionState[activeEmo] = { intensity: v, set: true, timestamp: Date.now() };
  closeIntensity();
  renderEmotions();
}

function updateIntensity(val) {
  const v = parseInt(val);
  const e = EMOTIONS.find(x => x.name === activeEmo);
  if (!e) return;

  document.getElementById('big-petal').setAttribute('fill', blendColor(e.color, v / 100));

  const fill = document.getElementById('slider-track-fill');
  fill.style.width = v + '%';

  const box = document.getElementById('slider-box');
  const boxW = box.offsetWidth || 360;
  const thumbW = 62;
  const startOffset = -10;
  const endOffset = boxW - thumbW + 10;
  const thumbLeft = startOffset + (v / 100) * (endOffset - startOffset);
  const thumb = document.getElementById('slider-thumb');
  thumb.style.left = thumbLeft + 'px';
  thumb.textContent = v;
}

/* ── Create entry ── */
function createEntry() {
  const title = document.getElementById('entry-title').value.trim();
  if (!title) { document.getElementById('entry-title').focus(); return; }

  journalEntries.unshift({
    title,
    body: document.getElementById('entry-body').value,
    date: now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' }),
    tag: selCat || 'Personal',
    emotions: Object.entries(emotionState)
      .filter(([, v]) => v.set && v.intensity > 0)
      .map(([k, v]) => ({ name: k, intensity: v.intensity }))
  });

  renderJournal();
  closeEntryScreen();
}

/* ── Init ── */
initFilterRow();
renderJournal();
initNav('journal');
</script>

  document.body.appendChild(wrap);

  const scene = wrap.querySelector('#radial-scene');
  const centerBtn = wrap.querySelector('#radial-center-btn');
  let radialOpen = false;

  centerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    radialOpen = !radialOpen;
    scene.classList.toggle('open', radialOpen);
  });

  document.addEventListener('click', (e) => {
    if (radialOpen && !scene.contains(e.target)) {
      radialOpen = false;
      scene.classList.remove('open');
    }
  });

  if (!document.getElementById('toast')) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.id = 'toast';
    document.body.appendChild(toast);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
